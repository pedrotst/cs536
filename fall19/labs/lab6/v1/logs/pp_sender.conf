set terminal png truecolor
set output "pp_sender.png"
set title "Sending rate of pp.au"
set autoscale
set format y "%.1f"
set xlabel "Time (s)"
set ylabel "Sending rate (pps)"
set style data lines

plot "pp_A_sender.txt" using 1:2 title "Method A",\
    "pp_B_sender.txt" using 1:2 title "Method B",\
    "pp_C_sender.txt" using 1:2 title "Method C",\
    "pp_D_sender.txt" using 1:2 title "Method D"
